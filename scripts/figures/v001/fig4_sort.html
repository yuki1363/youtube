<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../style.css"></head><body>
<div class="head"><div class="step">判定</div><div class="title">基準外は<em>返却口</em>へ</div></div>
<svg width="1080" height="1920"><defs>
<radialGradient id="coin" cx="38%" cy="35%" r="75%"><stop offset="0" stop-color="#FFF3B0"/><stop offset=".45" stop-color="var(--gold1)"/><stop offset="1" stop-color="var(--gold2)"/></radialGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E5E7EB"/><stop offset="1" stop-color="#9CA3AF"/></linearGradient>
<linearGradient id="copper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDBA74"/><stop offset=".5" stop-color="var(--copper1)"/><stop offset="1" stop-color="var(--copper2)"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#7c4a03" flood-opacity=".22"/></filter>
<symbol id="c" viewBox="-100 -100 200 200"><circle r="96" fill="url(#coin)" stroke="#92400E" stroke-width="6"/><circle r="74" fill="none" stroke="#B45309" stroke-width="5" opacity=".6"/><path d="M-40,-62 A74,74 0 0 1 40,-62" stroke="#fff" stroke-width="10" fill="none" opacity=".55" stroke-linecap="round"/></symbol>
</defs>
<use href="#c" x="470" y="420" width="140" height="140"/>
<path d="M540,560 L540,640" stroke="var(--ink)" stroke-width="12" stroke-linecap="round"/><path d="M515,620 L540,650 L565,620" fill="none" stroke="var(--ink)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<g filter="url(#sh)"><rect x="330" y="670" width="420" height="170" rx="36" fill="var(--ink)"/></g>
<text x="540" y="780" text-anchor="middle" font-size="76" font-weight="900" fill="#fff">判定</text>
<!-- 分かれ道 -->
<path d="M440,840 C420,930 300,960 270,1060" fill="none" stroke="#16A34A" stroke-width="40" stroke-linecap="round" opacity=".85"/>
<path d="M640,840 C660,930 780,960 810,1060" fill="none" stroke="var(--accent)" stroke-width="40" stroke-linecap="round" opacity=".85"/>
<!-- 受け入れ -->
<g filter="url(#sh)"><rect x="90" y="1080" width="360" height="300" rx="36" fill="#fff" stroke="#16A34A" stroke-width="8"/></g>
<circle cx="270" cy="1180" r="56" fill="#16A34A"/><path d="M240,1180 L263,1205 L302,1158" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
<text x="270" y="1310" text-anchor="middle" font-size="58" font-weight="900" fill="#16A34A">受け入れ</text>
<text x="270" y="1360" text-anchor="middle" font-size="36" fill="var(--muted)">基準内</text>
<!-- 返却口 -->
<g filter="url(#sh)"><rect x="630" y="1080" width="360" height="300" rx="36" fill="#fff" stroke="var(--accent)" stroke-width="8"/></g>
<use href="#c" x="755" y="1130" width="110" height="110"/>
<circle cx="860" cy="1140" r="34" fill="var(--accent)"/><path d="M845,1125 L875,1155 M875,1125 L845,1155" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
<text x="810" y="1310" text-anchor="middle" font-size="58" font-weight="900" fill="var(--accent)">返却口</text>
<text x="810" y="1360" text-anchor="middle" font-size="36" fill="var(--muted)">基準外</text>
</svg></body></html>
