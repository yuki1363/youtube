<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../style.css"></head><body>
<div class="head"><div class="step">検査 1</div><div class="title">大きさと<em>厚み</em></div></div>
<svg width="1080" height="1920"><defs>
<radialGradient id="coin" cx="38%" cy="35%" r="75%"><stop offset="0" stop-color="#FFF3B0"/><stop offset=".45" stop-color="var(--gold1)"/><stop offset="1" stop-color="var(--gold2)"/></radialGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E5E7EB"/><stop offset="1" stop-color="#9CA3AF"/></linearGradient>
<linearGradient id="copper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDBA74"/><stop offset=".5" stop-color="var(--copper1)"/><stop offset="1" stop-color="var(--copper2)"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#7c4a03" flood-opacity=".22"/></filter>
<symbol id="c" viewBox="-100 -100 200 200"><circle r="96" fill="url(#coin)" stroke="#92400E" stroke-width="6"/><circle r="74" fill="none" stroke="#B45309" stroke-width="5" opacity=".6"/><path d="M-40,-62 A74,74 0 0 1 40,-62" stroke="#fff" stroke-width="10" fill="none" opacity=".55" stroke-linecap="round"/></symbol>
</defs>
<!-- レール -->
<g filter="url(#sh)"><path d="M80,640 L1000,1010 L1000,1050 L80,680 Z" fill="url(#metal)" stroke="#6B7280" stroke-width="4"/></g>
<!-- 転がる硬貨 -->
<g stroke="#D97706" stroke-width="10" stroke-linecap="round" opacity=".5"><line x1="230" y1="590" x2="330" y2="630"/><line x1="210" y1="650" x2="320" y2="694"/></g>
<use href="#c" x="370" y="560" width="220" height="220"/>
<!-- センサー -->
<g filter="url(#sh)">
 <rect x="410" y="440" width="140" height="70" rx="16" fill="var(--blue)"/>
 <rect x="410" y="800" width="140" height="70" rx="16" fill="var(--blue)"/>
</g>
<g stroke="var(--blue-l)" stroke-width="8" stroke-dasharray="14 12"><line x1="480" y1="510" x2="480" y2="555"/><line x1="480" y1="785" x2="480" y2="800"/></g>
<text x="650" y="490" class="tag" fill="var(--blue)">センサー</text>
<!-- 直径の寸法 -->
<g stroke="var(--ink)" stroke-width="6"><line x1="320" y1="560" x2="320" y2="780"/><line x1="300" y1="560" x2="340" y2="560"/><line x1="300" y1="780" x2="340" y2="780"/></g>
<rect x="150" y="640" width="140" height="64" rx="14" fill="var(--ink)"/><text x="220" y="688" text-anchor="middle" class="tag" fill="#fff">直径</text>
<!-- 厚みの拡大カード -->
<g filter="url(#sh)"><rect x="180" y="1130" width="720" height="300" rx="36" fill="#fff"/></g>
<text x="240" y="1200" font-size="40" font-weight="700" fill="var(--muted)">横から見ると</text>
<rect x="590" y="1170" width="46" height="220" rx="10" fill="url(#coin)" stroke="#92400E" stroke-width="5"/>
<g stroke="var(--accent)" stroke-width="8" stroke-linecap="round"><line x1="520" y1="1280" x2="580" y2="1280"/><line x1="706" y1="1280" x2="646" y2="1280"/><path d="M560,1262 L582,1280 L560,1298" fill="none"/><path d="M666,1262 L644,1280 L666,1298" fill="none"/></g>
<text x="300" y="1300" font-size="72" font-weight="900" fill="var(--accent)">厚み</text>
</svg></body></html>
